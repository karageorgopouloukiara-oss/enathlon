<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Enathlon — Sala pausa</title>
<link rel="stylesheet" href="shared/theme.css">
<style>
  /* Ingombro fisso sopra e sotto la stanza: 18+18 di padding del .wrapper,
     58.5 di .logo-bar (34px di font + 6+6 di padding) e 14 di gap. Se cambia
     il logo, va rifatto questo conto. */
  :root { --chrome: 108.5px; }
  .wrapper { display:flex; flex-direction:column; gap:14px; padding:18px; margin:0 auto; box-sizing:border-box; align-items:center; }
  .logo-bar { display:flex; align-items:center; justify-content:center; padding:6px 0; }
  .logo-text { font-size:34px; }
  /* La stanza prende tutta la larghezza disponibile, ma il tappo vero è
     l'altezza: oltre un certo punto sfonderebbe sotto il bordo dello schermo,
     quindi la limitiamo all'altezza libera riportata in larghezza col rapporto
     900:520 della scena. */
  .room-wrapper { position:relative; background:#0d1117; border-radius:16px; overflow:hidden; width:100%; max-width:calc((100dvh - var(--chrome)) * 900 / 520); container-type:inline-size; }
  .room-canvas { width:100%; display:block; }
  /* La scala di .ui-scale è il rapporto fra la larghezza della stanza e le 900
     unità di disegno. calc() NON sa dividere due lunghezze per ottenere un
     numero puro, ma tan(atan2(a,b)) sì: atan2 restituisce l'angolo, la sua
     tangente è a/b. 100cqw = larghezza di .room-wrapper (il container qui
     sopra). Deliberatamente CSS e non JS: è layout, deve valere sempre e
     subito, anche dove i moduli non partono e prima che Firestore risponda. */
  .ui-scale { position:absolute; top:0; left:0; width:900px; height:520px; transform-origin:0 0; transform:scale(tan(atan2(100cqw, 900px))); pointer-events:none; }
  .layer { position:absolute; inset:0; }
  .av-wrap { position:absolute; display:flex; flex-direction:column; align-items:center; cursor:pointer; pointer-events:all; transition:transform .15s; }
  .av-wrap:hover { transform:scale(1.06); }
  .av-wrap .av-svg { width:92px; height:148px; } .av-wrap .av-svg svg { width:100%; height:100%; filter:drop-shadow(0 5px 5px rgba(0,0,0,.3)); }
  .av-name { margin-top:-6px; font-size:11px; font-weight:900; color:#33414a; background:rgba(255,255,255,.7); padding:1px 7px; border-radius:6px; }
  .av-dropdown { position:absolute; bottom:150px; left:50%; transform:translateX(-50%); background:#fff; border-radius:10px; padding:6px; box-shadow:0 4px 20px rgba(0,0,0,.4); display:none; flex-direction:column; gap:3px; min-width:150px; max-height:210px; overflow-y:auto; z-index:48; }
  .av-dropdown.open { display:flex; }
  .ddh { font-size:9px; font-weight:900; color:#999; text-transform:uppercase; letter-spacing:.5px; text-align:center; padding:2px 0 4px; position:sticky; top:0; background:#fff; }
  .dd-item { font-size:11px; font-weight:800; color:#006894; padding:5px 9px; border-radius:6px; background:#f0f9ff; text-align:left; cursor:pointer; border:1px solid #cce; }
  .dd-item:hover { background:#006894; color:#fff; } .dd-item.soon { opacity:.5; }
  .bubble { position:absolute; bottom:155px; left:50%; transform:translateX(-50%) scale(0); transform-origin:bottom center; background:#fff; border-radius:14px; padding:10px 12px; box-shadow:0 8px 24px rgba(0,0,0,.35); width:180px; text-align:center; z-index:50; transition:transform .3s cubic-bezier(.2,.9,.3,1.5); pointer-events:all; }
  .bubble.show { transform:translateX(-50%) scale(1); }
  .bubble-float { top:30px; bottom:auto; }  /* fallback: chi ha sfidato non è più in stanza */
  .bubble::after { content:''; position:absolute; bottom:-9px; left:50%; transform:translateX(-50%); border-left:10px solid transparent; border-right:10px solid transparent; border-top:10px solid #fff; }
  .bubble .bg { font-size:13px; font-weight:900; color:#006894; } .bubble .bw { font-size:11px; font-weight:700; color:#888; margin:1px 0 8px; }
  .bubble .acts { display:flex; gap:6px; } .bubble .acts button { flex:1; border:none; border-radius:8px; padding:7px 4px; font-family:inherit; font-weight:900; font-size:11px; cursor:pointer; }
  .acc { background:#1FC5A8; color:#06322a; } .dec { background:#f3e0de; color:#a33; }
  .poster { position:absolute; pointer-events:all; }
  .poster-frame { width:100%; height:100%; background:#fff; border:5px solid #5a4632; border-radius:4px; box-shadow:0 6px 16px rgba(0,0,0,.25); overflow:hidden; display:flex; flex-direction:column; }
  .dart-poster { cursor:crosshair; } .dart-poster:hover .poster-frame { outline:3px solid #C7FF1F; }
  .poster-title { font-size:9px; font-weight:900; text-align:center; padding:3px 0; letter-spacing:.5px; color:#fff; }
  .lead-title { background:#006894; color:#fff; font-size:9px; font-weight:900; text-align:center; padding:4px 2px; letter-spacing:.5px; }
  .lead-list { flex:1; padding:4px; display:flex; flex-direction:column; gap:3px; }
  .lrow { display:flex; align-items:center; gap:3px; font-size:9px; font-weight:800; color:#23323a; background:#f4f8fb; border-radius:4px; padding:2px 4px; }
  .lrow.top1 { background:#fff3c4; } .lrow.top2 { background:#eef1f4; } .lrow.top3 { background:#f6e8db; }
  .lrow .rk { width:13px; font-weight:900; color:#7a8a96; text-align:center; } .lrow .nmn { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; } .lrow .pts { font-weight:900; color:#006894; }
  .topbar { position:absolute; top:10px; right:10px; display:flex; flex-direction:column; gap:8px; align-items:flex-end; z-index:35; pointer-events:none; }
  .ctrl { display:flex; gap:6px; background:rgba(255,255,255,.92); padding:6px; border-radius:12px; box-shadow:0 2px 12px rgba(0,0,0,.25); pointer-events:all; align-items:center; }
  .ctrl .lbl { font-size:9px; font-weight:800; color:#888; padding:0 2px; }
  .weapon-btn { font-size:18px; width:34px; height:34px; border:2px solid transparent; border-radius:9px; background:#f0f0f0; cursor:pointer; display:flex; align-items:center; justify-content:center; }
  .weapon-btn.active { border-color:#006894; background:#e0f4ff; } .clear-btn { font-size:15px; }
  .gear-wrap { position:relative; pointer-events:all; }
  .gear-btn { font-size:20px; width:40px; height:40px; border:none; border-radius:50%; background:rgba(255,255,255,.92); cursor:pointer; box-shadow:0 2px 12px rgba(0,0,0,.25); display:flex; align-items:center; justify-content:center; transition:transform .3s; }
  .gear-btn:hover { transform:rotate(60deg); }
  .gear-menu { position:absolute; top:48px; right:0; background:#fff; border-radius:14px; padding:12px; box-shadow:0 8px 28px rgba(0,0,0,.35); display:none; flex-direction:column; gap:10px; min-width:190px; z-index:60; }
  .gear-menu.open { display:flex; }
  .gm-title { font-size:10px; font-weight:900; color:#999; text-transform:uppercase; letter-spacing:1px; padding-bottom:2px; border-bottom:1px solid #eee; }
  .gm-row { display:flex; align-items:center; justify-content:space-between; gap:8px; } .gm-lbl { font-size:12px; font-weight:800; color:#333; }
  .gm-btn { width:100%; padding:10px; border:none; border-radius:10px; font-family:inherit; font-size:13px; font-weight:900; cursor:pointer; }
  .gm-edit { background:#1FC5A8; color:#06222b; } .gm-out { background:#f0e3e1; color:#a33; }
  .throw-layer { position:absolute; inset:0; pointer-events:none; z-index:19; overflow:hidden; }
  .projectile { position:absolute; will-change:transform,left,top; font-size:24px; line-height:1; filter:drop-shadow(0 2px 2px rgba(0,0,0,.35)); }
  .cup-fg { position:absolute; bottom:-6px; left:50%; transform:translateX(-50%); width:150px; pointer-events:all; cursor:pointer; transition:transform .2s; z-index:20; }
  .cup-fg:hover { transform:translateX(-50%) translateY(-6px); }
  .cup-badge { position:absolute; top:-2px; right:24px; min-width:24px; height:24px; background:#C7FF1F; color:#1a3a0a; border-radius:50%; font-size:12px; font-weight:900; display:flex; align-items:center; justify-content:center; border:2px solid #0d1117; z-index:22; padding:0 4px; }
  .cup-badge.hidden { display:none; }
  .ongoing { position:absolute; bottom:120px; left:50%; transform:translateX(-50%); width:300px; background:#fff; border-radius:14px; box-shadow:0 12px 30px rgba(0,0,0,.45); padding:10px; z-index:46; display:none; pointer-events:all; }
  .ongoing.show { display:block; } .ongoing h4 { font-size:11px; font-weight:900; color:#006894; text-transform:uppercase; letter-spacing:1px; margin-bottom:8px; text-align:center; }
  .gitem { display:flex; align-items:center; gap:8px; padding:7px 8px; border-radius:9px; background:#f5f8fa; margin-bottom:6px; }
  .gitem .ic { font-size:18px; } .gitem .info { flex:1; min-width:0; } .gitem .gn { font-size:12px; font-weight:900; color:#23323a; } .gitem .st { font-size:10px; font-weight:700; }
  .st.your { color:#1a9e7a; } .st.wait { color:#b5892a; }
  .gitem .res { border:none; background:#006894; color:#fff; font-family:inherit; font-weight:900; font-size:10px; padding:6px 10px; border-radius:7px; cursor:pointer; }
  .empty { text-align:center; font-size:11px; color:#999; padding:8px; }
</style>

      <!-- Trapezio a specchio della finestra: bordo alto -24.87°, basso +12.39°

           piena; sinistro = lontano, schiacciato al 56.4%, col testo che si

</div>

<script type="module">

/* ---- clock ---- */
function clock(){ const n=new Date(); const h=(n.getHours()%12)+n.getMinutes()/60, m=n.getMinutes(); const cx=450,cy=64;
  const rot=(a,l)=>({x:cx+Math.cos((a-90)*Math.PI/180)*l,y:cy+Math.sin((a-90)*Math.PI/180)*l});
  const he=rot(h*30,9), me2=rot(m*6,15);
  $('#hHour').setAttribute('x2',he.x); $('#hHour').setAttribute('y2',he.y);
  $('#hMin').setAttribute('x2',me2.x); $('#hMin').setAttribute('y2',me2.y); }
clock(); setInterval(clock,10000);

/* ---- colleghi (avatar nella sala) ---- */
// Presenza: la lobby "batte" ogni HEARTBEAT_MS scrivendo lastSeen sul proprio
// profilo; è online (e quindi mostrato nella stanza) chi è stato visto negli
// ultimi ONLINE_WINDOW_MS. Richiede lastSeen fra i campi ammessi in
// firestore.rules, altrimenti il battito viene rifiutato e la stanza resta vuota.
const HEARTBEAT_MS = 30000;
const ONLINE_WINDOW_MS = 75000;

// Disposizione B: due gruppi ai lati della macchinetta (centro sempre libero).
// Gli online si spartiscono i due lati in modo bilanciato — indici pari a
// sinistra, dispari a destra — e dentro ogni lato si sfalsano in profondità, dal
// fronte-esterno al fondo-interno. Fino a 6 a dimensione piena; oltre, si
// rimpiccioliscono (scale) per starci tutti.
function computeLayout(n){
  const scale = n <= 6 ? 1 : Math.max(0.55, 6 / n);
  const side = (idxs, key) => idxs.map((idx, j) => {
    const t = idxs.length === 1 ? 0.4 : j / (idxs.length - 1);
    return { idx, scale, style: { [key]: (4 + 26 * t).toFixed(1) + '%',
                                  bottom: (6 + 20 * t).toFixed(1) + '%' } };
  });
  const left = [], right = [];
  for (let i = 0; i < n; i++) (i % 2 === 0 ? left : right).push(i);
  const out = new Array(n);
  side(left, 'left').forEach(s => out[s.idx] = s);
  side(right, 'right').forEach(s => out[s.idx] = s);
  return out;
}
let colleagues = [];

async function loadColleagues(){
  /* solo utenti realmente ONLINE (battito recente), escluso me. Ordine stabile
     per nick, così gli avatar non saltano di posto a ogni battito altrui. */
  const now = Date.now();
  colleagues = (await store.listPlayers())
    .filter(p => p.nick !== me.nick)
    .filter(p => p.lastSeen && now - p.lastSeen < ONLINE_WINDOW_MS)
    .sort((a, b) => (a.nickKey || a.nick).localeCompare(b.nickKey || b.nick));
}
function renderAvatars(){
  const layer=$('#avatarLayer'); layer.innerHTML='';
  const layout = computeLayout(colleagues.length);
  colleagues.forEach((c,i)=>{
    const L=layout[i]; const w=document.createElement('div'); w.className='av-wrap';
    w.dataset.nick = c.nick;                       // per agganciare il fumetto sfida
    Object.assign(w.style, L.style);
    const px = (base)=>Math.round(base*L.scale)+'px';
    w.innerHTML = `<div class="av-dropdown" id="dd${i}"></div>`+
      `<div class="av-svg" style="width:${px(92)};height:${px(148)}">${avatarSVG(c)}</div>`+
      `<div class="av-name">${c.nick}</div>`;
    w.onclick=(e)=>{ e.stopPropagation(); openChallenge(i,c); };
    layer.appendChild(w);
  });
  renderBubble();   // il fumetto deve sopravvivere ai re-render (i battiti sono frequenti)
}
function openChallenge(i,c){
  document.querySelectorAll('.av-dropdown').forEach(d=>d.classList.remove('open'));
  const dd=$('#dd'+i); dd.innerHTML='';
  const hdr=document.createElement('div'); hdr.className='ddh'; hdr.textContent=tt('challengeHdr'); dd.appendChild(hdr);
  GAMES.forEach(g=>{ const it=document.createElement('div'); it.className='dd-item'+(g.status!=='ready'?' soon':'');
    it.textContent=`${g.icon} ${t(g.key)}`;
    it.onclick=async(e)=>{ e.stopPropagation(); dd.classList.remove('open');
      if(g.status!=='ready'){ toast(t(g.key)+' — '+tt('soon')); return; }
      if(g.online){
        if (g.id === 'uno') {
          const nicks = await pickPlayers(c, 6);      // [me escluso] 1..5 avversari
          if (!nicks || nicks.length < 1) return;
          const players = [me.nick, ...nicks];        // players[0] = me = primo a muovere
          const dealt = deal(players, shuffle(buildDeck(), Math.random));
          const initState = {
            deck: dealt.deck, discard: dealt.discard, hands: dealt.hands,
            color: dealt.color, direction: 1, retired: [], drawn: null
          };
          const match = await store.createMatch(g.id, players, initState);
          for (const n of nicks) await store.sendChallenge(g.id, me.nick, n, match.id);
          toast(tt('sent')(nicks.join(', '), t(g.key)));
          setTimeout(() => location.href = g.path + '?match=' + match.id, 600);
          return;
        }
        if (g.id === 'ludo') {
          const nicks = await pickPlayers(c, 4);      // 1..3 avversari (max 4 totali)
          if (!nicks || nicks.length < 1) return;
          const players = [me.nick, ...nicks];        // players[0] = me = primo a muovere
          // seats: 2 giocatori opposti [0,2]; altrimenti sequenziale
          const seatOrder = players.length === 2 ? [0, 2] : [0, 1, 2, 3];
          const seats = {}, tokens = {};
          players.forEach((n, i) => { seats[n] = seatOrder[i]; tokens[n] = [-1, -1]; });
          const initState = {
            seed: Math.floor(Math.random() * 2147483647),
            rollIndex: 0, pending: null, tokens, seats, retired: []
          };
          const match = await store.createMatch(g.id, players, initState);
          for (const n of nicks) await store.sendChallenge(g.id, me.nick, n, match.id);
          toast(tt('sent')(nicks.join(', '), t(g.key)));
          setTimeout(() => location.href = g.path + '?match=' + match.id, 600);
          return;
        }
        if (g.id === 'pictionary') {
          const lang = await pickLang(g);              // lingua delle parole (IT/EN)
          if (!lang) return;
          const nicks = await pickPlayers(c, 6);       // 1..5 avversari (max 6 totali)
          if (!nicks || nicks.length < 1) return;
          const players = [me.nick, ...nicks];         // players[0] = me = primo a disegnare
          const scores = {};
          players.forEach(n => { scores[n] = 0; });
          const initState = {
            lang, seed: Math.floor(Math.random() * 2147483647),
            roundIndex: 0, phase: 'drawing',
            strokes: [], guesses: {}, scores, retired: []
          };
          const match = await store.createMatch(g.id, players, initState);
          for (const n of nicks) await store.sendChallenge(g.id, me.nick, n, match.id);
          toast(tt('sent')(nicks.join(', '), t(g.key)));
          setTimeout(() => location.href = g.path + '?match=' + match.id, 600);
          return;
        }
        // vera partita online: crea match condiviso + invia la sfida col matchId
        let lang = null;
        if(g.id==='scrabble'){
          lang = await pickLang(g);         // mini scelta IT/EN
          if(!lang) return;                 // annullata
        }
        const initState = g.id==='hangman' ? { secret:{}, rows:{}, done:{} }
          /* Niente 'phase' qui: la Battaglia Navale deriva la fase da 'ready'
             (schierato / non schierato), che è l'unico campo che qualcuno
             aggiorna davvero. Un phase:'placing' scritto qui e mai avanzato
             teneva bloccato il tiro. Scrabble e Pictionary invece la fase la
             gestiscono per davvero, quindi la loro resta. */
          : g.id==='battleship' ? { fleets:{}, shots:{}, ready:{} }
          : g.id==='scrabble' ? { lang, phase:'init' }
          : g.id==='chess' ? { board: CHESS_START.slice(),
                               castling:{ wK:true, wQ:true, bK:true, bQ:true },
                               epTarget:null,
                               colors:{ [me.nick]:'w', [c.nick]:'b' },
                               lastMove:null }
          : g.id==='backgammon' ? { points: BG_START.slice(),
                                    bar:{ w:0, b:0 },
                                    off:{ w:0, b:0 },
                                    colors:{ [me.nick]:'w', [c.nick]:'b' },
                                    seed: Math.floor(Math.random() * 2147483647),
                                    turnIndex: 0,
                                    lastMove: null }
          : { board:['','','','','','','','',''] };
        const match = await store.createMatch(g.id, [me.nick, c.nick], initState);
        await store.sendChallenge(g.id, me.nick, c.nick, match.id);
        toast(tt('sent')(c.nick, t(g.key)));
        setTimeout(()=>location.href=g.path+'?match='+match.id, 600);
      } else {
        // gioco locale (pass-and-play)
        setTimeout(()=>location.href=g.path, 200);
      }
    };
    dd.appendChild(it); });
  dd.classList.add('open');
}

/* Scelta lingua per i giochi che ne hanno bisogno (Scrabble, Pictionary).
   `game` = voce di catalogo: il titolo mostra la sua icona e il suo nome. */
function pickLang(game){
  return new Promise(resolve => {
    const ov = document.createElement('div');
    ov.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;z-index:9999';
    ov.innerHTML = `<div style="background:var(--panel-2);padding:22px;border-radius:16px;text-align:center;min-width:220px">
      <div style="font-weight:900;margin-bottom:14px">${game.icon} ${t(game.key)} — ${getLang()==='it'?'Lingua':'Language'}</div>
      <div style="display:flex;gap:10px;justify-content:center">
        <button data-l="it" style="flex:1;padding:12px;border:none;border-radius:12px;background:var(--lime);color:#123;font-weight:800;cursor:pointer">🇮🇹 IT</button>
        <button data-l="en" style="flex:1;padding:12px;border:none;border-radius:12px;background:var(--lime);color:#123;font-weight:800;cursor:pointer">🇬🇧 EN</button>
      </div></div>`;
    ov.onclick = (e) => { if(e.target===ov){ ov.remove(); resolve(null); } };
    ov.querySelectorAll('button').forEach(b => b.onclick = () => { ov.remove(); resolve(b.dataset.l); });
    document.body.appendChild(ov);
  });
}

/* Selezione 1-5 avversari per un gioco multi-giocatore.
   `first` = collega già cliccato (preselezionato). Ritorna array di nick, o null. */
async function pickPlayers(first, maxTotal) {
  const all = (await store.listPlayers()).map(p => p.nick).filter(n => n !== me.nick);
  const chosen = new Set([first.nick]);
  return new Promise(resolve => {
    const ov = document.createElement('div');
    ov.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;z-index:9999';
    const list = all.map(n =>
      `<label style="display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:10px;background:var(--panel);cursor:pointer">
        <input type="checkbox" value="${n}" ${n===first.nick?'checked':''}> ${n}</label>`).join('');
    ov.innerHTML = `<div style="background:var(--panel-2);padding:22px;border-radius:16px;min-width:260px;max-width:90vw">
      <div style="font-weight:900;margin-bottom:12px">🟥 ${t('g_uno')} — ${getLang()==='it'?'Scegli i giocatori':'Pick players'}</div>
      <div id="ppList" style="display:flex;flex-direction:column;gap:6px;max-height:40vh;overflow:auto;margin-bottom:14px">${list}</div>
      <button id="ppGo" style="width:100%;padding:12px;border:none;border-radius:12px;background:var(--lime);color:#123;font-weight:800;cursor:pointer">${getLang()==='it'?'Inizia':'Start'}</button>
    </div>`;
    const update = () => {
      ov.querySelectorAll('#ppList input').forEach(cb => {
        cb.onchange = () => {
          if (cb.checked && chosen.size >= maxTotal - 1) { cb.checked = false; return; }
          cb.checked ? chosen.add(cb.value) : chosen.delete(cb.value);
        };
      });
    };
    update();
    ov.querySelector('#ppGo').onclick = () => { ov.remove(); resolve([...chosen]); };
    ov.onclick = (e) => { if (e.target === ov) { ov.remove(); resolve(null); } };
    document.body.appendChild(ov);
  });
}

/* ---- sfide in arrivo (bolla) ---- */
// Il fumetto della sfida compare SOPRA l'avatar di chi l'ha lanciata (ch.from),
// non più fisso a sinistra. Poiché i battiti di presenza fanno ri-renderizzare
// gli avatar di continuo, non lo teniamo appeso a un avatar "usa e getta": la
// sfida attiva sta in activeChallenge e renderBubble() la riattacca ogni volta.
let activeChallenge = null;
function renderBubble(){
  document.querySelectorAll('.bubble').forEach(b=>b.remove());
  const ch = activeChallenge; if(!ch) return;
  const g=gameById(ch.game);
  const b=document.createElement('div'); b.className='bubble';
  b.innerHTML=`<div class="bg">${g?g.icon+' '+t(g.key):ch.game}</div><div class="bw">${ch.from} ${tt('challenges')}</div>`+
    `<div class="acts"><button class="acc">${tt('accept')}</button><button class="dec">${tt('decline')}</button></div>`;
  b.onclick=(e)=>e.stopPropagation();
  // sopra chi ha sfidato; se nel frattempo ha chiuso la lobby (non è tra gli
  // avatar), il fumetto va in alto al centro così non lo si perde.
  const w=[...document.querySelectorAll('#avatarLayer .av-wrap')].find(el=>el.dataset.nick===ch.from);
  if(w) w.appendChild(b); else { b.classList.add('bubble-float'); $('#avatarLayer').appendChild(b); }
  requestAnimationFrame(()=>b.classList.add('show'));
  b.querySelector('.acc').onclick=async()=>{ activeChallenge=null; await store.removeChallenge(ch.id); toast(tt('accepted')(g?t(g.key):ch.game));
    if(g && ch.matchId) setTimeout(()=>location.href=g.path+'?match='+ch.matchId,500);
    else if(g && g.status==='ready') setTimeout(()=>location.href=g.path,400);
    else renderBubble(); };
  b.querySelector('.dec').onclick=async()=>{ activeChallenge=null; await store.removeChallenge(ch.id); toast(tt('declined')); renderBubble(); };
}
function showBubble(ch){ if(activeChallenge) return; activeChallenge=ch; renderBubble(); }

let weapon='dart';
window.selWeapon=(el,w)=>{ weapon=w; document.querySelectorAll('.weapon-btn[data-w]').forEach(b=>b.classList.remove('active')); el.classList.add('active'); };
function projInner(w){ if(w==='axe')return'🪓'; if(w==='knife')return'🔪'; return '<svg width="22" height="40" viewBox="0 0 22 40"><polygon points="11,0 8,9 14,9" fill="#c0392b"/><rect x="9.5" y="8" width="3" height="20" fill="#2c3e50"/><polygon points="11,26 4,38 11,33 18,38" fill="#e74c3c"/></svg>'; }
const finalRot={dart:0,axe:35,knife:-25}; const stuck=[];
window.throwWeapon=()=>{ const layer=$('#throwLayer'),board=$('#dartboard'); const lR=layer.getBoundingClientRect(),bR=board.getBoundingClientRect();
  // getBoundingClientRect misura in px di SCHERMO, ma left/top qui sotto sono
  // unità di disegno dentro .ui-scale: k converte le une nelle altre. Senza
  // questa divisione le freccette mancano il bersaglio appena la stanza non è
  // larga esattamente 900px.
  const k=lR.width/layer.offsetWidth;
  const R=Math.min(bR.width,bR.height)/2*0.6/k, ang=Math.random()*Math.PI*2, dist=Math.random()*R;
  const tx=(bR.left-lR.left+bR.width/2)/k+Math.cos(ang)*dist, ty=(bR.top-lR.top+bR.height/2)/k+Math.sin(ang)*dist;
  const p=document.createElement('div'); p.className='projectile'; p.innerHTML=projInner(weapon);
  p.style.left=(layer.offsetWidth/2)+'px'; p.style.top=(layer.offsetHeight+30)+'px'; p.style.transform='translate(-50%,-50%) scale(2.4) rotate(-300deg)';
  layer.appendChild(p);
  requestAnimationFrame(()=>requestAnimationFrame(()=>{ p.style.transition='transform .42s, left .42s, top .42s'; p.style.left=tx+'px'; p.style.top=ty+'px'; p.style.transform='translate(-50%,-50%) scale(.7) rotate('+finalRot[weapon]+'deg)'; }));
  stuck.push(p); if(stuck.length>20){ stuck.shift().remove(); } };
window.clearDarts=()=>{ stuck.forEach(p=>p.remove()); stuck.length=0; toast(L[getLang()].cleared); };

/* ---- boot + realtime ---- */
// Battito di presenza: mi segno online adesso e poi ogni HEARTBEAT_MS finché la
// lobby resta aperta. Il try/catch evita che un eventuale rifiuto (regole
// Firestore senza il campo lastSeen) blocchi la pagina.
async function beat(){ try { await store.updatePlayer(me.nick, { lastSeen: Date.now() }); }
  catch(e){ console.warn('heartbeat lastSeen rifiutato — aggiornare firestore.rules?', e.message); } }
await beat();
setInterval(beat, HEARTBEAT_MS);

await loadColleagues();
applyLang();
store.subscribePlayers(() => { loadColleagues().then(() => { renderAvatars(); renderLeader(); }); });
store.subscribeMatchesFor(me.nick, () => { renderOngoing(); renderBadge(); });
store.subscribeChallengesFor(me.nick, (cs) => { if (cs && cs.length) showBubble(cs[0]); });
</script>
